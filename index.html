<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexPlanet Consolidated Task 2 Project</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">Contact Form</div>
        <nav>
            <a href="#form-section">Contact</a>
            <a href="#todo-section">To-Do List</a>
        </nav>
    </header>

    <main class="grid-container">
        <section id="form-section" class="form-area">
            <h2>Contact Form with Validation</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required>
                    <div class="error-message" id="nameError"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea id="message" name="message" rows="3" required></textarea>
                    <div class="error-message" id="messageError"></div>
                </div>

                <fieldset>
                    <legend>Gender</legend>
                    <p>
                        Male <input type="radio" name="Gender" id="male" required=""> Female <input type="radio"
                            name="Gender" id="female" required="">
                    </p>
                </fieldset>

                <p class="address">
                    Address: <textarea name="address" id="address" cols="100" rows="5" required></textarea>
                </p>

                <button type="submit">Submit Form</button>
            </form>
        </section>

        <section id="todo-section" class="todo-area">
            <h2>Dynamic To-Do List (DOM Manipulation)</h2>
            <div id="task-input-container">
                <input type="text" id="taskInput" placeholder="Add a new task..." required>
                <button id="addTaskBtn">Add</button>
            </div>
            <ul id="taskList">
            </ul>
        </section>
    </main>

    <footer>
        <p>Responsive, Validated, and Dynamic Project | ApexPlanet Internship</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
